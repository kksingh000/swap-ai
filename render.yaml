# Render Blueprint for the FastAPI backend.
# Deploy: https://render.com/deploy?repo=https://github.com/kksingh000/swap-ai
#
# IMPORTANT: env vars declared here with a `value` are owned by this file.
# Render overwrites dashboard edits to them on every Blueprint sync. Anything
# that must be managed from the dashboard - secrets, and provider choices that
# depend on which accounts exist - is declared `sync: false` instead, so Render
# leaves the dashboard value alone.
services:
  - type: web
    name: swap-ai-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: >
      pip install -r requirements.txt &&
      python ../training/generate_dataset.py --samples 180 &&
      python ../training/train_classifier.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # ---- Owned by this file -------------------------------------------
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      # Free tier has an ephemeral disk: this database resets on every deploy
      # and every spin-down. Attach a disk or use Postgres to persist leads.
      - key: DATABASE_URL
        value: sqlite:///./swap_agent.db
      - key: CORS_ORIGINS
        value: https://swap-ai-tau.vercel.app,http://localhost:5173
      # Vercel gives every deployment its own hostname, so the stable domain
      # above is not enough - preview builds would be blocked by CORS. This
      # matches this account's deployments only, not all of vercel.app.
      - key: CORS_ORIGIN_REGEX
        value: ^https://swap-[a-z0-9-]+-kksingh000s-projects\.vercel\.app$
      # Twilio calls back to this, so it must be the public https origin.
      - key: PUBLIC_BASE_URL
        value: https://swap-ai-backend.onrender.com
      - key: TIMEZONE
        value: Asia/Kolkata
      # Real outbound calling is the intended mode for this deployment. The API
      # returns 503 rather than faking a call if credentials turn out to be absent.
      - key: TELEPHONY_PROVIDER
        value: twilio

      # ---- Set in the Render dashboard; never overwritten by a sync ------
      # Twilio accepts either the account auth token or a scoped API key pair.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      # mock (default) renders in the dashboard simulator; twilio sends for real.
      - key: WHATSAPP_PROVIDER
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      # rules = deterministic and free. Set openai_compatible plus a Groq key
      # for more natural phrasing.
      - key: LLM_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
